<svg viewBox="0 0 300 350" role="img" aria-labelledby="wf-t wf-d" xmlns="http://www.w3.org/2000/svg">
  <title id="wf-t">Five-step structure of each piece of writing</title>
  <desc id="wf-d">A vertical sequence: claim or question, the real problem, visible evidence, trade-offs and limits, one next step.</desc>
  <line x1="22" y1="22" x2="22" y2="302" stroke="#171717" stroke-width="3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#171717">
    <g>
      <rect x="10" y="10" width="24" height="24" fill="#fff8e6" stroke="#171717" stroke-width="3"/>
      <text x="52" y="22" font-size="11" font-family="ui-monospace, Menlo, monospace" letter-spacing="1">01</text>
      <text x="52" y="42" font-size="18" font-weight="700">Claim or question</text>
    </g>
    <g>
      <rect x="10" y="80" width="24" height="24" fill="#fff8e6" stroke="#171717" stroke-width="3"/>
      <text x="52" y="92" font-size="11" font-family="ui-monospace, Menlo, monospace" letter-spacing="1">02</text>
      <text x="52" y="112" font-size="18" font-weight="700">The real problem</text>
    </g>
    <g>
      <rect x="10" y="150" width="24" height="24" fill="#fff8e6" stroke="#171717" stroke-width="3"/>
      <text x="52" y="162" font-size="11" font-family="ui-monospace, Menlo, monospace" letter-spacing="1">03</text>
      <text x="52" y="182" font-size="18" font-weight="700">Visible evidence</text>
    </g>
    <g>
      <rect x="10" y="220" width="24" height="24" fill="#fff8e6" stroke="#171717" stroke-width="3"/>
      <text x="52" y="232" font-size="11" font-family="ui-monospace, Menlo, monospace" letter-spacing="1">04</text>
      <text x="52" y="252" font-size="18" font-weight="700">Trade-offs and limits</text>
    </g>
    <g>
      <rect x="10" y="290" width="24" height="24" fill="#f6c234" stroke="#171717" stroke-width="3"/>
      <text x="52" y="302" font-size="11" font-family="ui-monospace, Menlo, monospace" letter-spacing="1">05</text>
      <text x="52" y="322" font-size="18" font-weight="700">One clear next step</text>
    </g>
  </g>
</svg>
